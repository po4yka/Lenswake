name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version-name: ${{ steps.release.outputs.version_name }}
      version-code: ${{ steps.release.outputs.version_code }}
    steps:
      - name: Check out tagged commit and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        id: release
        run: scripts/ci/validate-release-tag.sh "$GITHUB_REF_NAME" origin/main

  host:
    name: host
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Verify CI and release contracts
        run: |
          scripts/ci/test-build-contract.sh
          scripts/ci/test-release-contract.sh
      - name: Repeat host release gate
        run: >-
          ./gradlew
          check
          assembleDebug
          :app:assembleDebugAndroidTest
          :data:assembleDebugAndroidTest
          --console=plain
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-host-failure-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  instrumented:
    name: instrumented-api-${{ matrix.label }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 35
            api-level: 35
            target: aosp_atd
            channel: stable
            ram-size: 2048M
          - label: 36
            api-level: 36
            target: aosp_atd
            channel: stable
            ram-size: 2048M
          - label: 37
            api-level: "37.0"
            target: google_apis
            channel: canary
            ram-size: 4096M
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Assemble instrumentation artifacts
        run: >-
          ./gradlew
          :data:assembleDebugAndroidTest
          :app:assembleDebugAndroidTest
          --console=plain
      - name: Stop Gradle daemons before emulator startup
        if: always()
        run: ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Repeat ordinary instrumentation gate
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          channel: ${{ matrix.channel }}
          arch: x86_64
          profile: pixel_7_pro
          ram-size: ${{ matrix.ram-size }}
          disk-size: 6G
          script: scripts/ci/run-instrumentation.sh
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-instrumented-api-${{ matrix.label }}-failure-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: publish
    needs:
      - validate
      - host
      - instrumented
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # Create the GitHub Release and upload its verified assets.
      attestations: write # Store build provenance for the signed APK.
      id-token: write # Sign provenance through GitHub OIDC.
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Restore protected signing material
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.LENSWAKE_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.LENSWAKE_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.LENSWAKE_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.LENSWAKE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing release environment secret: $value" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/lenswake-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          chmod 600 "$keystore"
          mkdir -p "$GRADLE_USER_HOME"
          chmod 700 "$GRADLE_USER_HOME"
          {
            printf 'lenswake.release.storeFile=%s\n' "$keystore"
            printf 'lenswake.release.storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'lenswake.release.keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'lenswake.release.keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } >"$GRADLE_USER_HOME/gradle.properties"
          chmod 600 "$GRADLE_USER_HOME/gradle.properties"
      - name: Build signed minified APK
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Verify and name release artifact
        env:
          VERSION_NAME: ${{ needs.validate.outputs.version-name }}
          VERSION_CODE: ${{ needs.validate.outputs.version-code }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"
          mkdir -p release
          release_apk="release/Lenswake-$VERSION_NAME.apk"
          cp "$source_apk" "$release_apk"
          scripts/ci/verify-release-apk.sh "$release_apk" "$VERSION_NAME" "$VERSION_CODE"
          (
            cd release
            sha256sum "Lenswake-$VERSION_NAME.apk" >SHA256SUMS.txt
          )
      - name: Attest release APK provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Lenswake-${{ needs.validate.outputs.version-name }}.apk
      - name: Create, verify, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APK: release/Lenswake-${{ needs.validate.outputs.version-name }}.apk
        run: >-
          scripts/ci/publish-release.sh
          "$GITHUB_REF_NAME"
          "$RELEASE_APK"
          release/SHA256SUMS.txt
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/lenswake-release.jks"
          rm -f "$GRADLE_USER_HOME/gradle.properties"
