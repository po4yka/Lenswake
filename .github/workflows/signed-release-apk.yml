name: Signed release APK

on:
  workflow_call:
    secrets:
      LENSWAKE_RELEASE_KEYSTORE_BASE64:
        required: false
      LENSWAKE_RELEASE_STORE_PASSWORD:
        required: false
      LENSWAKE_RELEASE_KEY_ALIAS:
        required: false
      LENSWAKE_RELEASE_KEY_PASSWORD:
        required: false
    inputs:
      version-name:
        required: true
        type: string
      version-code:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      record-candidate:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: signed-release-apk
    if: >-
      github.repository == 'po4yka/Lenswake' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: read
      attestations: write # Store provenance for this exact signed APK.
      id-token: write # Sign provenance through GitHub OIDC.
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Restore protected signing material
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.LENSWAKE_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.LENSWAKE_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.LENSWAKE_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.LENSWAKE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for value in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing release environment secret: $value" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/lenswake-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          chmod 600 "$keystore"
          mkdir -p "$GRADLE_USER_HOME"
          chmod 700 "$GRADLE_USER_HOME"
          {
            printf 'lenswake.release.storeFile=%s\n' "$keystore"
            printf 'lenswake.release.storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'lenswake.release.keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'lenswake.release.keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } >"$GRADLE_USER_HOME/gradle.properties"
          chmod 600 "$GRADLE_USER_HOME/gradle.properties"
      - name: Build signed minified APK
        run: ./gradlew :app:assembleRelease --no-configuration-cache --console=plain
      - name: Verify and name release artifact
        env:
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"
          mkdir -p release
          release_apk="release/Lenswake-$VERSION_NAME.apk"
          cp "$source_apk" "$release_apk"
          scripts/ci/test-release-apk.sh "$release_apk" "$VERSION_NAME" "$VERSION_CODE"
          (
            cd release
            sha256sum "Lenswake-$VERSION_NAME.apk" >SHA256SUMS.txt
          )
      - name: Attest release APK provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Lenswake-${{ inputs.version-name }}.apk
      - name: Record immutable candidate identity
        if: inputs.record-candidate
        env:
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          apk="release/Lenswake-$VERSION_NAME.apk"
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          {
            printf 'schemaVersion=1\n'
            printf 'tag=%s\n' "$GITHUB_REF_NAME"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'versionName=%s\n' "$VERSION_NAME"
            printf 'versionCode=%s\n' "$VERSION_CODE"
            printf 'apkFilename=%s\n' "$(basename "$apk")"
            printf 'apkSha256=%s\n' "$apk_sha256"
          } >release/RELEASE-CANDIDATE.txt
      - name: Upload verified signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/lenswake-release.jks"
          rm -f "$GRADLE_USER_HOME/gradle.properties"
