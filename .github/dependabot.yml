version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tbilisi
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Tbilisi
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci(deps)
